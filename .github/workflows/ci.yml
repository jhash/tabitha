name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-test:
    runs-on: tabitha-amd64
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tabitha_test?sslmode=disable
      TEST_MIGRATE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tabitha_test_migrate?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres 17 on the self-hosted runner
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSLo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-17
          sudo pg_ctlcluster 17 main start
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres'"
          sudo -u postgres createdb tabitha_test
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Ensure psql client is installed
        run: |
          command -v psql >/dev/null && exit 0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE tabitha_test_migrate"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -p 1

  editor-test:
    runs-on: tabitha-amd64
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  e2e:
    runs-on: tabitha-amd64
    needs: [go-test, editor-test]
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tabitha_e2e_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres 17 on the self-hosted runner
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSLo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-17
          sudo pg_ctlcluster 17 main start
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres'"
          sudo -u postgres createdb tabitha_e2e_test
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd editor && npm ci
      - run: cd e2e && npm ci
      - run: cd e2e && npx playwright install --with-deps chromium
      - run: cd e2e && npx playwright test
